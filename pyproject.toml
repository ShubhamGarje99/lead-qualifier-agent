[project]
name = "leadq"
version = "0.1.0"
description = "Inbound lead qualifier: a LangGraph agent with human-in-the-loop approval, checkpointing, retries, cost tracking and evals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shubham Garje" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
leadq = "leadq.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
